name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Make the base branch available to Moon
        if: github.event_name == 'pull_request'
        run: git branch --track main origin/main
      - uses: moonrepo/setup-toolchain@v0
        with:
          proto-version: "0.63.2"
          auto-install: true
      - run: bun install --frozen-lockfile
      - run: moon run gurafu:check gurafu:tsc gurafu:knip gurafu:build
      - run: bunx playwright install --with-deps chromium
      - run: moon run gurafu:test-solux gurafu:test-chart
